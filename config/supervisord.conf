[inet_http_server]
port=*:8900        ; *:port for all iface
username=yiimp
password=supervisor
; check status from outside container with 'supervisorctl -u yiimp -p supervisor -s http://127.0.0.1:8900 status'

[supervisord]
logfile=/tmp/supervisord.log ; main log file; default $CWD/supervisord.log
logfile_maxbytes=50MB        ; max main logfile bytes b4 rotation; default 50MB
logfile_backups=10           ; # of main logfile backups; 0 means none, default 10
loglevel=info                ; log level; default info; others: debug,warn,trace
pidfile=/tmp/supervisord.pid ; supervisord pidfile; default supervisord.pid
nodaemon=true               ; start in foreground if true; default false
silent=false                 ; no logs to stdout if true; default false
minfds=1024                  ; min. avail startup file descriptors; default 1024
minprocs=200

; container internal memcached
[program:memcached]
command=/usr/bin/memcached -m 64 -p 11211 -u memcache -l 127.0.0.1 -P /var/run/memcached/memcached.pid
process_name=%(program_name)s ; process_name expr (default %(program_name)s)
numprocs=1                    ; number of processes copies to start (def 1)
directory=/tmp                ; directory to cwd to before exec (def no cwd)
umask=022                     ; umask for process (default None)
priority=999                  ; the relative start priority (default 999)
autostart=false               ; start at supervisord start (default: true)
autorestart=true              ; restart after exit
user=root                     ; run as user 1 (root)

; container internal cron
[program:cron]
command=/usr/sbin/cron -f
process_name=%(program_name)s ; process_name expr (default %(program_name)s)
numprocs=1                    ; number of processes copies to start (def 1)
directory=/tmp                ; directory to cwd to before exec (def no cwd)
umask=022                     ; umask for process (default None)
priority=999                  ; the relative start priority (default 999)
autostart=true                ; start at supervisord start (default: true)
autorestart=true              ; restart after exit
user=root                     ; run as user 1 (root)

; container internal haproxy
[program:haproxy]
command=/usr/sbin/haproxy -f /etc/yiimp/haproxy
process_name=%(program_name)s ; process_name expr (default %(program_name)s)
numprocs=1                    ; number of processes copies to start (def 1)
directory=/tmp                ; directory to cwd to before exec (def no cwd)
umask=022                     ; umask for process (default None)
priority=999                  ; the relative start priority (default 999)
autostart=false                ; start at supervisord start (default: true)
autorestart=true              ; restart after exit
user=root                     ; run as user 1 (root)

; apache web
[program:yiimp-apache]
command=apachectl -D FOREGROUND
stopsignal=6
process_name=%(program_name)s ; process_name expr (default %(program_name)s)
numprocs=1                    ; number of processes copies to start (def 1)
directory=/tmp                ; directory to cwd to before exec (def no cwd)
umask=022                     ; umask for process (default None)
priority=999                  ; the relative start priority (default 999)
autostart=true                ; start at supervisord start (default: true)
autorestart=true              ; restart after exit
user=root                     ; run as user 33 (www-data/apache)

; ─── yii2-queue workers (replaces main.sh / loop2.sh / blocks.sh) ──────────
;
; Startup order: seed (100) → blocks worker (200) → general workers (300).
; Prerequisites: MySQL must be up and the `queue` table must exist.
; To create the queue table run: php yii migrate --migrationPath=@yii/queue/db/migrations

; Runs once at container start to push all 22 recurring jobs into the queue.
; Exits cleanly after seeding — supervisor does NOT restart it.
; Safe to run again at any time (existing active jobs are not duplicated).
[program:yiimp-queue-seed]
command=php yii queue/seed
process_name=%(program_name)s
numprocs=1
directory=/var/yiimp2
umask=022
priority=100
autostart=true
autorestart=false
startsecs=0
stopsignal=TERM
user=33                       ; www-data

; Dedicated worker for the time-critical block pipeline.
; Polls the queue every second so block jobs (15–30s cadence) are picked up
; with minimal latency. Handles: ProcessNewBlocksJob, UpdateBlockConfirmationsJob,
; ScanTransactionsJob, MonitorBtcJob — plus any other ready job it finds first.
[program:yiimp-queue-blocks]
command=php yii queue/listen --color=0 1
process_name=%(program_name)s
numprocs=1
directory=/var/yiimp2
umask=022
priority=200
autostart=true
autorestart=true
startretries=5
stopwaitsecs=60               ; allow current job to finish before SIGKILL
stopsignal=TERM
user=33

; General-purpose workers for all other recurring jobs (coins, stats, market,
; renting, payments, system). Two processes run in parallel so slow jobs
; (e.g. ScanTransactionsJob) do not delay faster ones (e.g. UpdateCoinStatsJob).
[program:yiimp-queue-general]
command=php yii queue/listen --color=0
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/var/yiimp2
umask=022
priority=300
autostart=true
autorestart=true
startretries=5
stopwaitsecs=60
stopsignal=TERM
user=33

;stratum servers
[program:stratum-scrypt]
command=stratum /etc/yiimp/stratum/scrypt.conf
process_name=%(program_name)s ; process_name expr (default %(program_name)s)
numprocs=1                    ; number of processes copies to start (def 1)
directory=/tmp                ; directory to cwd to before exec (def no cwd)
umask=022                     ; umask for process (default None)
priority=999                  ; the relative start priority (default 999)
autostart=false               ; start at supervisord start (default: true)
autorestart=true              ; restart after exit
user=root                     ; run as user 33 (www-data/apache)
